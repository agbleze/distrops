[tool.poetry]
name = "distrops"
version = "0.1.0"
description = "Distributed training and hyperparameter optimization"
authors = ["Linus Agbleze"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.optional-dependencies]
dev = ["pytest", "black", "ruff"]
dashboard = ["tensorboard>=2.14.0"]
all = ["distrops[dev, dashboard]"]


[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]      
version_variable = ["src/distrops/__init__.py:__version__"]

[tool.semantic_release.branch.main]
changelog_file = "CHANGELOG.md"                      # changelog file
build_command = "pip install poetry && poetry build" # build dists 

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
distrops = "distrops.runner:main"

[tool.semantic_release.remote.token]
env = "GITHUB_TOKEN"

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <auto-build>"

[tool.semantic_release.publish]
upload_to_vcs_release=true
dist_glob_patterns = ["dist/"]


